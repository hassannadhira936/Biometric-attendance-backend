# Al-Ihsan Girls Secondary School - Biometric Attendance
# ==========================================================

# ---------- MySQL ----------
# createDatabaseIfNotExist=true lets MySQL create the database on first start.
# (Database name kept exactly as in the original project.)
spring.datasource.url=jdbc:mysql://localhost:3306/biometric_atttendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# update = create/alter tables automatically. Employee ID is now a VARCHAR primary key,
# so run database/reset_database.sql ONCE if you already have the old (BIGINT) tables.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Server ----------
server.port=8080

# ---------- WebAuthn tables ----------
# Runs schema.sql (CREATE TABLE IF NOT EXISTS) so a fresh database on another PC works.
spring.sql.init.mode=always

# ---------- WebAuthn (fingerprint) ----------
# rp-id must be a DOMAIN NAME (never an IP) and must match the address in the browser.
# Local PC:            rp-id=localhost
# Phone on WiFi (test): rp-id=10-4-11-118.sslip.io  (sslip.io turns it into 10.4.11.118)
app.webauthn.rp-id=refinish-shaft-suspend.ngrok-free.dev
app.webauthn.allowed-origins=https://refinish-shaft-suspend.ngrok-free.dev
